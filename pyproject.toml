[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-assembler"
version = "0.1.0"
description = "Model-agnostic residual assembly framework (crystal plasticity is one example backend)"
readme = "residual_core/README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
dependencies = ["numpy", "scipy>=1.10"]  # scipy.sparse: history replay (residual_core/replay/history.py)

[project.optional-dependencies]
test = ["pytest>=7", "wheel", "mpmath>=1.3", "matplotlib>=3.8", "tomli>=2; python_version < '3.11'"]
yaml = ["PyYAML"]
# Optional Streamlit front end (residual_core/app, launched by scripts/app.py).
# It is an extra, not a dependency: the GUI only builds argv lists and calls
# residual_core.ui.cli.main in-process, so the CLI and the Python API must stay
# installable without pulling a web framework in.
gui = ["streamlit>=1.30"]
# The companion product. Residual_Assembler and UMAT-OTI are separate packages
# connected by a versioned contract, so the bridge tests need umat_oti present.
# The pin is a commit, not a branch: a moving branch would make this repository's
# CI result depend on when it ran. Bump it deliberately when the contract moves,
# and record the pair in the compatibility matrix.
bridge = [
	"umat-oti @ git+https://github.com/AMMS-Lab-UTSA/UMAT_source_transformation.git@faa03605574c0bf96c7d1f83c3c9c02e83d2d11f",
]

[project.scripts]
resasm = "residual_core.ui.cli:main"

[tool.setuptools.packages.find]
# Automatic discovery: picks up every subpackage (residual_core.algebra,
# residual_core.ui, resasm_user, partner_kit.python, ...) so the user-facing
# workflow is fully importable after `pip install -e .`. Do not hand-maintain
# a package list here -- new subpackages must not silently go unshipped.
include = ["residual_core*", "resasm_user*", "partner_kit*"]
exclude = ["tests*", "sources*", "scripts*"]

[tool.setuptools.package-data]
"residual_core" = ["example_manifest.json", "example_manifest.md"]
"residual_core.replay" = ["contract/*.json", "contract/*.h"]
"residual_core.examples" = ["*/*.json", "*/*.md"]
"residual_core.umat_adapter_fortran" = ["*.f90", "aba_stubs/*.f", "aba_stubs/*.f90"]

[tool.setuptools.data-files]
"share/residual-assembler/templates/user_python_residual" = ["templates/user_python_residual/resasm.yml", "templates/user_python_residual/solution.npy", "templates/user_python_residual/user_residual.py", "templates/user_python_residual/README.md"]
"share/residual-assembler/templates/user_blackbox_residual" = ["templates/user_blackbox_residual/resasm.yml", "templates/user_blackbox_residual/solution.npy", "templates/user_blackbox_residual/my_solver.py", "templates/user_blackbox_residual/README.md"]
"share/residual-assembler/templates/user_blackbox_order2_residual" = ["templates/user_blackbox_order2_residual/resasm.yml", "templates/user_blackbox_order2_residual/solution.npy", "templates/user_blackbox_order2_residual/my_solver.py", "templates/user_blackbox_order2_residual/README.md"]
"share/residual-assembler/templates/user_cpp_residual" = ["templates/user_cpp_residual/resasm.yml", "templates/user_cpp_residual/solution.npy", "templates/user_cpp_residual/residual.cpp", "templates/user_cpp_residual/CMakeLists.txt", "templates/user_cpp_residual/README.md"]
"share/residual-assembler/templates/user_fortran_residual" = ["templates/user_fortran_residual/resasm.yml", "templates/user_fortran_residual/solution.npy", "templates/user_fortran_residual/residual.f90", "templates/user_fortran_residual/Makefile", "templates/user_fortran_residual/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
	"unit: pure-Python logic; no compiler, no Abaqus, milliseconds",
	"integration: several components together, still offline and redistributable",
	"regression: pins a behaviour that was once wrong; the docstring says which",
	"slow: minutes rather than milliseconds",
	"network: reaches the public internet; excluded from the offline suite",
	"fortran: needs a Fortran compiler on PATH",
	"abaqus: needs a licensed Abaqus installation; cannot run in public CI",
	"arc: needs the documented HPC environment and its scheduler",
	"publication: regenerates or checks a published artefact",
	"gui: a GUI workflow driven in a headless browser; deselected unless selected with -m gui (tests/gui/conftest.py)",
]
