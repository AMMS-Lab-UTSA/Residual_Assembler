name: CI

# The point of this workflow is that a misconfigured checkout must go RED, not
# green-but-smaller. External Abaqus sources are pinned submodules; without them
# eight tests skip and the suite still passes, which is indistinguishable from a
# healthy run. REQUIRE_EXTERNAL_TEST_SOURCES=1 turns those skips into failures.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  offline-suite:
    name: Offline suite (strict external sources)
    runs-on: ubuntu-latest
    steps:
      - name: Check out without submodules
        uses: actions/checkout@v4
        with:
          # Deliberately NOT submodules: true. The bootstrap script is the
          # supported path and it is what must be exercised here, because it is
          # also what enforces the licence tiers.
          submodules: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[yaml,bridge]" pytest

      - name: Initialize required permissive sources only
        run: ./scripts/init_permissive_sources.sh

      - name: Verify submodule contract (offline)
        run: python scripts/verify_source_submodules.py -v

      - name: Assert restricted tiers were not fetched
        # Copyleft and licence-unknown sources are reference-only. If setup ever
        # pulls one in, that is a licensing incident, not a test failure.
        run: |
          set -euo pipefail
          status=0
          for path in sources/copyleft/* sources/license-unknown/*; do
            [ -d "$path" ] || continue
            git ls-tree HEAD "$path" | grep -q '^160000' || continue
            count=$(ls -A "$path" | wc -l)
            if [ "$count" -ne 0 ]; then
              echo "::error::restricted source was fetched into $path ($count entries)"
              status=1
            else
              echo "ok (empty): $path"
            fi
          done
          exit $status

      - name: Install gfortran
        # The material adapters compile Fortran. Without a compiler those tests
        # skip, which is the exact "green but smaller" outcome this workflow
        # exists to prevent -- and it is what made the baseline check fail:
        # 65 passed / 11 skipped on a runner with no compiler against a
        # baseline measured on a machine that had one.
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version

      - name: Run the suite in strict mode
        env:
          REQUIRE_EXTERNAL_TEST_SOURCES: "1"
        run: python -m pytest -q

      - name: Every skip must name a declared external dependency
        env:
          REQUIRE_EXTERNAL_TEST_SOURCES: "1"
        # A hardcoded "68 passed, 9 skipped" string breaks whenever the suite
        # grows and says nothing about *why* a count moved. What actually needs
        # guarding is that nothing skips for a reason the runner should have
        # satisfied: a missing compiler, an unfetched permissive source, an
        # import error. OTILib is the one dependency this environment genuinely
        # cannot provide, so it is the only accepted reason.
        run: |
          set -euo pipefail
          python -m pytest -q -rs 2>&1 | tee /tmp/suite.txt
          python - <<'PY'
          import re, sys
          text = open("/tmp/suite.txt").read()
          reasons = re.findall(r"^SKIPPED \[\d+\] (.+)$", text, re.MULTILINE)
          unexpected = [r for r in reasons if "OTILib" not in r]
          summary = text.strip().splitlines()[-1]
          print("summary:", summary)
          if unexpected:
              print("::error::these tests skipped for a reason CI should have satisfied:")
              for reason in unexpected:
                  print("  ", reason)
              sys.exit(1)
          if " failed" in summary or " error" in summary:
              print("::error::the offline suite did not pass cleanly")
              sys.exit(1)
          print(f"all {len(reasons)} skips are the declared OTILib dependency")
          PY

  strict-mode-guard:
    name: Strict mode must fail without the sources
    runs-on: ubuntu-latest
    steps:
      # Proves the guard itself works. Without this, a broken strict mode would
      # let the job above go green for the wrong reason.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[yaml,bridge]" pytest
      - name: Suite must FAIL with sources absent and strict mode on
        env:
          REQUIRE_EXTERNAL_TEST_SOURCES: "1"
        run: |
          set -euo pipefail
          if python -m pytest -q > out.txt 2>&1; then
            cat out.txt
            echo "::error::strict mode stayed green with the external sources absent"
            exit 1
          fi
          grep -q "init_permissive_sources.sh" out.txt || {
            cat out.txt
            echo "::error::strict-mode failure did not carry the bootstrap instructions"
            exit 1
          }
          echo "strict mode correctly refused to run green."

  audit:
    name: Repository standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit
        run: python tools/audit_repository_standards.py
